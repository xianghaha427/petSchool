server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: PetSchool
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_school?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 11111111

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.petschool.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

# Knife4j/Swagger 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    com.petschool: debug
    com.petschool.mapper: debug
pet:
  jwt:
    secret-key:  xiangxiangaihaha1234567890hahaaixiangxiang1234567890
    ttl: 86400000
    token-name: Authorization
  # AI 能力配置：api-key 缺失时应用仍可正常启动，只是识别/简介接口返回 1004
  ai:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    chat-path: /chat/completions
    vision-model: qwen3-vl-flash
    text-model: qwen-plus
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    max-image-bytes: 4194304
    json-mode: false
    mock: false
    mock-delay-ms: 800
  # 本地上传配置
  upload:
    dir: ./uploads
    url-prefix: /api/uploads
    max-bytes: 4194304