server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: PetSchool
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_school?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 11111111

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.petschool.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

# Knife4j/Swagger 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    com.petschool: debug
    com.petschool.mapper: debug
pet:
  jwt:
    secret-key:  xiangxiangaihaha1234567890hahaaixiangxiang1234567890
    ttl: 86400000
    token-name: Authorization
  # 本地上传配置
  upload:
    dir: ./uploads
    # 注意：url-prefix 里含 context-path(/api)，改 context-path 时必须同步改这里
    url-prefix: /api/uploads
    # 与前端校验、spring.servlet.multipart.max-file-size 保持同一个 5MB 边界
    max-bytes: 5242880
  # AI 识别配置（通义千问 / DashScope，OpenAI 兼容模式）
  ai:
    # API Key 只从环境变量注入，绝不写死在本文件里（本文件会进 git）。
    # 未配置时应用照常启动，AI 接口返回 1004「AI 服务暂时不可用」，用户手动填写即可。
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 识图用多模态模型，生成简介用文本模型
    vision-model: qwen3-vl-flash
    text-model: qwen-plus
    # 与图片上传共用同一个 5MB 边界（前端校验、multipart 上限也都是 5MB）
    max-image-bytes: 5242880
    # 置 true 则不联网、不消耗额度，改用 MockAiClient 返回模拟识别结果
    mock: false